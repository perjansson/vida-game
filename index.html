<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Voffracet</title>
    <style>
      [hidden] { display: none !important; }
      body, button, input { font-family: 'Fredoka', system-ui, sans-serif; font-weight: 600; }
      h2, #info { font-weight: 700 !important; }
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1035; }
      canvas { display: block; touch-action: none; }
      #info {
        padding: 0 12px; text-align: center;
        font-family: 'Fredoka', system-ui, sans-serif;
        font-size: clamp(26px, 7vw, 54px); line-height: 1.1; letter-spacing: 1px;
        color: #ffd93d;
        -webkit-text-stroke: 2px #2a1458;
        paint-order: stroke fill;
        text-shadow: 0 4px 0 #ff5fa2, 0 8px 14px rgba(0, 0, 0, 0.45);
        transform: rotate(-2deg);
        pointer-events: none; user-select: none;
      }
      #top {
        position: fixed; top: max(14px, env(safe-area-inset-top)); left: 0; right: 0;
        display: flex; flex-direction: column; align-items: center; gap: 10px;
        pointer-events: none;
      }
      #name {
        pointer-events: auto;
        font-family: 'Fredoka', system-ui, sans-serif;
        font-size: clamp(18px, 4.5vw, 24px); letter-spacing: 1px; text-align: center;
        width: min(50vw, 300px); min-height: 48px; box-sizing: border-box; padding: 6px 12px;
        color: #2a1458; background: #fff; border: 3px solid #2a1458; border-radius: 16px;
        box-shadow: 0 4px 0 #ff5fa2; outline: none;
      }
      #row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; justify-content: center; padding: 0 10px; }
      #language, #sound {
        pointer-events: auto; width: 52px; height: 48px; padding: 0; font-size: 26px;
        background: #ffd93d; border: 3px solid #2a1458; border-radius: 16px;
        box-shadow: 0 4px 0 #ff5fa2; cursor: pointer;
        touch-action: manipulation; -webkit-tap-highlight-color: transparent;
      }
      #language:active, #sound:active { transform: translateY(3px); box-shadow: 0 1px 0 #ff5fa2; }
      #name::placeholder { color: #b9a6dd; }
      #wardrobe {
        position: fixed; left: 0; right: 0; bottom: 0;
        padding: 8px 8px max(8px, env(safe-area-inset-bottom));
        display: flex; flex-direction: column; gap: 6px;
        background: rgba(27, 16, 53, 0.72); border-top: 3px solid #ffd93d;
        font-family: 'Fredoka', system-ui, sans-serif;
      }
      #wardrobe button {
        font-family: inherit; cursor: pointer; flex: none;
        touch-action: manipulation; user-select: none; -webkit-tap-highlight-color: transparent;
      }
      #chips { display: flex; gap: 8px; overflow-x: auto; padding: 3px; scrollbar-width: none; }
      #chips::-webkit-scrollbar { display: none; }
      #chips > :first-child { margin-left: auto; }
      #chips > :last-child { margin-right: auto; }
      .chip {
        min-height: 46px; padding: 6px 14px; white-space: nowrap;
        font-size: clamp(15px, 4vw, 20px); letter-spacing: 0.5px;
        color: #2a1458; background: #fff; border: 3px solid #2a1458; border-radius: 14px;
      }
      .chip.chosen { background: #ffd93d; box-shadow: 0 0 0 3px #ff5fa2; }
      #colors { display: flex; gap: 7px; justify-content: center; min-height: 36px; }
      .dot { width: 36px; height: 36px; padding: 0; border-radius: 50%; border: 3px solid #2a1458; }
      .dot.chosen { box-shadow: 0 0 0 3px #ffd93d; transform: scale(1.12); }
      #tabs { display: flex; gap: 5px; justify-content: center; }
      #wardrobe .tab {
        flex: 1 1 0; min-width: 0; max-width: 80px; height: 50px; padding: 0; font-size: 24px;
        background: #ffd93d; border: 3px solid #2a1458; border-radius: 14px; box-shadow: 0 4px 0 #ff5fa2;
      }
      #wardrobe .tab.chosen { background: #ff5fa2; box-shadow: none; transform: translateY(3px); }
      #wardrobe .tab:active { transform: translateY(3px); box-shadow: none; }
      /* Liggande mobil: lägg plagg och färger bredvid varandra så att hunden får plats */
      @media (max-height: 520px) and (min-width: 600px) {
        #wardrobe { flex-direction: row; flex-wrap: wrap; align-items: center; justify-content: center; padding-top: 5px; column-gap: 12px; }
        #chips { flex: 1 1 50%; min-width: 0; }
        #colors { gap: 5px; }
        .dot { width: 30px; height: 30px; }
        #tabs { flex: 1 1 100%; }
        #wardrobe .tab { height: 42px; }
        .chip { min-height: 42px; }
      }
      #start {
        position: fixed; inset: 0; z-index: 10;
        display: flex; align-items: center; justify-content: center;
        padding: 12px; box-sizing: border-box; overflow-y: auto;
        background: rgba(27, 16, 53, 0.75);
        font-family: 'Fredoka', system-ui, sans-serif;
      }
      #start[hidden] { display: none; }
      #card {
        width: min(100%, 460px); margin: auto; box-sizing: border-box;
        padding: clamp(14px, 3vh, 26px) clamp(14px, 4vw, 26px);
        display: flex; flex-direction: column; align-items: center; gap: clamp(8px, 2vh, 16px);
        background: linear-gradient(#5b3bb0, #3b2a6b);
        border: 4px solid #ffd93d; border-radius: 28px;
        box-shadow: 0 8px 0 #ff5fa2, 0 16px 30px rgba(0, 0, 0, 0.5);
      }
      #card .paws { font-size: clamp(22px, 5vh, 36px); line-height: 1; }
      #card h1 {
        font-family: 'Luckiest Guy', 'Fredoka', sans-serif;
        margin: 0; text-align: center; font-weight: normal;
        font-size: clamp(38px, 12vw, 64px); line-height: 1.1; letter-spacing: 2px;
        color: #ffd93d; -webkit-text-stroke: 2px #2a1458; paint-order: stroke fill;
        text-shadow: 0 4px 0 #ff5fa2; transform: rotate(-2deg);
      }
      #card ul {
        list-style: none; margin: 0; padding: 0; align-self: stretch;
        display: flex; flex-direction: column; gap: clamp(4px, 1.2vh, 10px);
      }
      #card li {
        display: flex; align-items: center; gap: 10px;
        padding: 6px 12px; border-radius: 14px; background: rgba(255, 255, 255, 0.14);
        color: #fff; font-size: clamp(14px, 4vw, 19px); letter-spacing: 0.5px; line-height: 1.2;
      }
      #card li span:first-child { font-size: 1.4em; }
      #langs { display: flex; gap: 8px; align-self: stretch; }
      #langs button {
        flex: 1; min-width: 0; min-height: 52px; padding: 4px;
        font-family: inherit; font-size: clamp(13px, 3.6vw, 18px); letter-spacing: 0.5px;
        color: #2a1458; background: #fff; border: 3px solid #2a1458; border-radius: 14px;
        cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
      }
      #langs button.chosen { background: #ffd93d; box-shadow: 0 0 0 3px #ff5fa2; }
      #play {
        font-family: inherit; font-size: clamp(24px, 7vw, 36px); letter-spacing: 2px;
        width: 100%; min-height: clamp(56px, 11vh, 76px);
        color: #fff; background: #2ecc71; -webkit-text-stroke: 1.5px #14532d; paint-order: stroke fill;
        border: 3px solid #14532d; border-radius: 20px; box-shadow: 0 6px 0 #14532d;
        cursor: pointer; touch-action: manipulation; -webkit-tap-highlight-color: transparent;
        animation: pulse 1.2s ease-in-out infinite;
      }
      #play:active { transform: translateY(4px); box-shadow: 0 2px 0 #14532d; animation: none; }
      @keyframes pulse { 50% { transform: scale(1.04); } }
      /* Gröna "kör"-knappar och vita vanliga knappar */
      .go, .plain {
        pointer-events: auto; font-family: 'Fredoka', system-ui, sans-serif;
        font-size: clamp(17px, 4.6vw, 24px); letter-spacing: 1px;
        min-height: 48px; padding: 6px 18px; border-radius: 16px; cursor: pointer;
        touch-action: manipulation; user-select: none; -webkit-tap-highlight-color: transparent;
      }
      .go { color: #fff; background: #2ecc71; border: 3px solid #14532d; box-shadow: 0 4px 0 #14532d; text-shadow: 0 2px 0 #14532d; }
      .go:active { transform: translateY(3px); box-shadow: 0 1px 0 #14532d; }
      .go:disabled { background: #9aa5a0; border-color: #555; box-shadow: 0 4px 0 #555; text-shadow: none; opacity: 0.7; }
      .plain { color: #2a1458; background: #fff; border: 3px solid #2a1458; }
      /* På banan: hjärtan, banans nummer och hur långt man har kommit */
      #hud {
        position: fixed; top: max(12px, env(safe-area-inset-top)); left: 0; right: 0; padding: 0 14px;
        display: flex; flex-direction: column; align-items: center; gap: 8px;
        font-family: 'Fredoka', system-ui, sans-serif; pointer-events: none; user-select: none;
      }
      #hudRow { display: flex; gap: 18px; align-items: center; font-size: clamp(24px, 6vw, 36px); }
      #levelName { color: #fff; -webkit-text-stroke: 2px #2a1458; paint-order: stroke fill; letter-spacing: 1px; }
      #progress { width: min(86vw, 460px); height: 16px; background: rgba(255, 255, 255, 0.6); border: 3px solid #2a1458; border-radius: 12px; overflow: hidden; }
      #progressBar { height: 100%; width: 0; background: #ff5fa2; }
      #hint {
        position: fixed; left: 0; right: 0; bottom: max(24px, env(safe-area-inset-bottom)); text-align: center;
        font-size: clamp(20px, 5.5vw, 30px); color: #fff; -webkit-text-stroke: 2px #2a1458; paint-order: stroke fill; letter-spacing: 1px;
      }
      .popup {
        position: fixed; inset: 0; z-index: 5; display: flex; align-items: center; justify-content: center;
        padding: 16px; background: rgba(27, 16, 53, 0.55); font-family: 'Fredoka', system-ui, sans-serif;
      }
      .popup .box, .panel {
        display: flex; flex-direction: column; align-items: center; gap: 10px; text-align: center;
        background: linear-gradient(#5b3bb0, #3b2a6b); border: 4px solid #ffd93d;
        font-family: 'Fredoka', system-ui, sans-serif;
      }
      .popup .box { width: min(100%, 360px); padding: 20px; border-radius: 26px; box-shadow: 0 8px 0 #ff5fa2; }
      .popup h2, .panel h2 { margin: 0; font-weight: normal; font-size: clamp(26px, 7vw, 38px); color: #ffd93d; text-shadow: 0 3px 0 #ff5fa2; letter-spacing: 1px; }
      .popup p, .panel p { margin: 0; color: #fff; font-size: clamp(16px, 4.4vw, 20px); letter-spacing: 0.5px; }
      .popup .go, .popup .plain { width: 100%; }
      .panel {
        position: fixed; left: 0; right: 0; bottom: 0; gap: 8px;
        padding: 10px 10px max(10px, env(safe-area-inset-bottom));
        border-width: 4px 0 0; 
      }
      #careButtons, #careNext { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
      #careButtons button { font-family: inherit; cursor: pointer; touch-action: manipulation; }
      #careButtons button:disabled { opacity: 0.6; cursor: default; }
      #careButtons button.chosen:disabled { opacity: 1; }
      .float {
        position: fixed; top: 42%; z-index: 4; font-size: 40px; pointer-events: none; opacity: 0;
        animation: floatUp 1.3s ease-out forwards;
      }
      @keyframes floatUp {
        0% { opacity: 0; transform: translateY(20px) scale(0.5); }
        20% { opacity: 1; }
        100% { opacity: 0; transform: translateY(-170px) scale(1.3); }
      }
      @media (max-height: 520px) {
        .panel { flex-direction: row; flex-wrap: wrap; justify-content: center; column-gap: 14px; }
        .panel h2 { font-size: 24px; }
      }
      .count {
        font-size: clamp(18px, 4.8vw, 26px); color: #2a1458; background: #fff6e0;
        border: 3px solid #2a1458; border-radius: 16px; padding: 4px 12px; white-space: nowrap;
      }
      #careReward { font-size: clamp(22px, 6vw, 30px) !important; color: #ffd93d !important; }
    </style>
  </head>
  <body>
    <div id="top">
      <div id="info">Klä ut hunden!</div>
      <div id="row">
        <input id="name" type="text" maxlength="12" placeholder="Hundens namn" autocomplete="off" autocapitalize="words" spellcheck="false" />
        <button id="language" aria-label="Byt språk">🌍</button>
        <button id="sound" aria-label="Ljud av eller på">🔊</button>
        <button id="runButton" class="go"></button>
        <span id="boneCount" class="count"></span>
      </div>
    </div>
    <div id="wardrobe">
      <div id="chips"></div>
      <div id="colors"></div>
      <div id="tabs"></div>
    </div>
    <div id="hud" hidden>
      <div id="hudRow"><span id="hearts"></span><span id="levelName"></span><span id="runBones" class="count"></span></div>
      <div id="progress"><div id="progressBar"></div></div>
      <div id="hint"></div>
    </div>
    <div id="lost" class="popup" hidden>
      <div class="box">
        <h2 id="lostTitle"></h2>
        <p id="lostText"></p>
        <button id="retry" class="go"></button>
        <button id="lostHome" class="plain"></button>
      </div>
    </div>
    <div id="care" class="panel" hidden>
      <h2 id="careTitle"></h2>
      <p id="careReward"></p>
      <p id="careText"></p>
      <div id="careButtons"></div>
      <div id="careNext">
        <button id="nextLevel" class="go"></button>
        <button id="careHome" class="plain"></button>
      </div>
    </div>
    <div id="start">
      <div id="card">
        <div class="paws">🐾 🐩 🐾</div>
        <h1>Voffracet</h1>
        <ul>
          <li><span>🐶</span><span data-t="Välj hund och kläder längst ner">Välj hund och kläder längst ner</span></li>
          <li><span>🏃</span><span data-t="Spring banor och hoppa över hinder">Spring banor och hoppa över hinder</span></li>
          <li><span>🦴</span><span data-t="Samla ben på banorna">Samla ben på banorna</span></li>
          <li><span>💗</span><span data-t="Ta hand om hunden efter varje bana">Ta hand om hunden efter varje bana</span></li>
          <li><span>✏️</span><span data-t="Ge hunden ett namn">Ge hunden ett namn</span></li>
        </ul>
        <div id="langs">
          <button data-lang="sv">🇸🇪 Svenska</button>
          <button data-lang="fi">🇫🇮 Suomi</button>
          <button data-lang="en">🇬🇧 English</button>
        </div>
        <button id="play" data-t="Spela!">Spela!</button>
      </div>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
