<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Vidas spel</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1035; }
      canvas { display: block; touch-action: none; }
      #info {
        padding: 0 12px; text-align: center;
        font-family: 'Luckiest Guy', system-ui, sans-serif;
        font-size: clamp(26px, 7vw, 54px); line-height: 1.1; letter-spacing: 1px;
        color: #ffd93d;
        -webkit-text-stroke: 2px #2a1458;
        paint-order: stroke fill;
        text-shadow: 0 4px 0 #ff5fa2, 0 8px 14px rgba(0, 0, 0, 0.45);
        transform: rotate(-2deg);
        pointer-events: none; user-select: none;
      }
      #top {
        position: fixed; top: max(14px, env(safe-area-inset-top)); left: 0; right: 0;
        display: flex; flex-direction: column; align-items: center; gap: 10px;
        pointer-events: none;
      }
      #name {
        pointer-events: auto;
        font-family: 'Luckiest Guy', system-ui, sans-serif;
        font-size: clamp(18px, 4.5vw, 24px); letter-spacing: 1px; text-align: center;
        width: min(62vw, 300px); min-height: 48px; box-sizing: border-box; padding: 6px 12px;
        color: #2a1458; background: #fff; border: 3px solid #2a1458; border-radius: 16px;
        box-shadow: 0 4px 0 #ff5fa2; outline: none;
      }
      #row { display: flex; gap: 10px; align-items: center; justify-content: center; }
      #language {
        pointer-events: auto; width: 52px; height: 48px; padding: 0; font-size: 26px;
        background: #ffd93d; border: 3px solid #2a1458; border-radius: 16px;
        box-shadow: 0 4px 0 #ff5fa2; cursor: pointer;
        touch-action: manipulation; -webkit-tap-highlight-color: transparent;
      }
      #language:active { transform: translateY(3px); box-shadow: 0 1px 0 #ff5fa2; }
      #name::placeholder { color: #b9a6dd; }
      #buttons {
        position: fixed; left: 0; right: 0; bottom: max(12px, env(safe-area-inset-bottom));
        display: grid; grid-template-columns: repeat(4, minmax(0, 170px));
        justify-content: center; gap: 10px; padding: 0 10px;
      }
      @media (max-width: 600px) {
        #buttons { grid-template-columns: repeat(2, 1fr); }
      }
      #buttons button {
        font-family: 'Luckiest Guy', system-ui, sans-serif;
        font-size: clamp(16px, 4.2vw, 24px); letter-spacing: 1px;
        min-height: 64px; padding: 8px 14px;
        color: #2a1458; background: #ffd93d;
        border: 3px solid #2a1458; border-radius: 18px;
        box-shadow: 0 5px 0 #ff5fa2; cursor: pointer;
        touch-action: manipulation; user-select: none; -webkit-tap-highlight-color: transparent;
      }
      #buttons button:active { transform: translateY(4px); box-shadow: 0 1px 0 #ff5fa2; }
      #buttons small { display: block; font-size: 0.7em; color: #7b3fd1; margin-top: 2px; }
      #start {
        position: fixed; inset: 0; z-index: 10;
        display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 14px;
        padding: 16px; box-sizing: border-box;
        background: rgba(27, 16, 53, 0.88);
        font-family: 'Luckiest Guy', system-ui, sans-serif;
      }
      #start[hidden] { display: none; }
      #start h1 {
        margin: 0 0 8px; text-align: center; font-weight: normal;
        font-size: clamp(22px, 6vw, 42px); line-height: 1.2; letter-spacing: 1px;
        color: #ffd93d; text-shadow: 0 4px 0 #ff5fa2;
      }
      #start button {
        font-family: inherit; font-size: clamp(22px, 6vw, 34px); letter-spacing: 1px;
        width: min(80vw, 320px); min-height: min(76px, 15vh);
        color: #2a1458; background: #ffd93d;
        border: 3px solid #2a1458; border-radius: 20px;
        box-shadow: 0 6px 0 #ff5fa2; cursor: pointer;
        touch-action: manipulation; -webkit-tap-highlight-color: transparent;
      }
      #start button:active { transform: translateY(4px); box-shadow: 0 2px 0 #ff5fa2; }
    </style>
  </head>
  <body>
    <div id="top">
      <div id="info">Klä ut hunden!</div>
      <div id="row">
        <input id="name" type="text" maxlength="12" placeholder="Skriv hundens namn" autocomplete="off" autocapitalize="words" spellcheck="false" />
        <button id="language" aria-label="Byt språk">🌍</button>
      </div>
    </div>
    <div id="buttons"></div>
    <div id="start">
      <h1>Välj språk<br />Valitse kieli<br />Choose language</h1>
      <button data-lang="sv">🇸🇪 Svenska</button>
      <button data-lang="fi">🇫🇮 Suomi</button>
      <button data-lang="en">🇬🇧 English</button>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
