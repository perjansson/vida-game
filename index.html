<!doctype html>
<html lang="sv">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Vidas spel</title>
    <style>
      html, body { margin: 0; height: 100%; overflow: hidden; background: #1b1035; }
      canvas { display: block; touch-action: none; }
      #info {
        position: fixed; top: max(14px, env(safe-area-inset-top)); left: 0; right: 0;
        padding: 0 12px; text-align: center;
        font-family: 'Luckiest Guy', system-ui, sans-serif;
        font-size: clamp(26px, 7vw, 54px); line-height: 1.1; letter-spacing: 1px;
        color: #ffd93d;
        -webkit-text-stroke: 2px #2a1458;
        paint-order: stroke fill;
        text-shadow: 0 4px 0 #ff5fa2, 0 8px 14px rgba(0, 0, 0, 0.45);
        transform: rotate(-2deg);
        pointer-events: none; user-select: none;
      }
    </style>
  </head>
  <body>
    <div id="info">Tryck på hunden!</div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
